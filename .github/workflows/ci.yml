name: Continuous Integration

env:
  JOB_FAILS: "false"
  RAYLIB_PACKAGES: libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

on:
  pull_request:
    branches-ignore:
      - 'temp/*'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # Linux compilation gate
  # ============================================================

  compilation_required:
    name: Compilation required
    if: ${{ github.repository != vars.MIRROR_URL }}
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    timeout-minutes: 5

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt update
          apt install -y tar zstd $RAYLIB_PACKAGES

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Build binary
        shell: bash
        run: |
          set -eo pipefail

          if [ -f Makefile ]; then
            echo "Detected Makefile"
            make -j$(nproc) 2>&1 | tee build.log

          elif [ -f CMakeLists.txt ]; then
            echo "Detected CMake project"

            cmake --preset linux-release 2>&1 | tee build.log
            cmake --build --preset linux-release 2>&1 | tee -a build.log

          else
            echo "No supported build system found"
            exit 1
          fi

      - name: Annotate build errors
        if: failure()
        shell: bash
        run: .github/scripts/annotate-build-log.sh build.log

      - name: Check executables
        if: ${{ vars.EXECUTABLES != '' }}
        env:
          EXECUTABLES: ${{ vars.EXECUTABLES }}
        run: |
          for binary in $EXECUTABLES; do
            if [ ! -x "$binary" ]; then
              echo "::error::Missing executable: $binary"
              exit 1
            fi
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

  # ============================================================
  # Linux server-only compilation
  #
  # A plain Ubuntu image with no X11 or OpenGL packages: if a
  # client-side target or Raylib leaks into a server-only build,
  # configuring or linking fails here.
  # ============================================================

  compilation_server_only:
    name: Server-only compilation
    if: ${{ github.repository != vars.MIRROR_URL }}
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 5

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

    steps:
      - name: Install dependencies
        run: |
          apt update
          apt install -y --no-install-recommends cmake make g++ git ca-certificates tar zstd

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Build the server only
        shell: bash
        run: |
          set -eo pipefail

          cmake --preset linux-release -DRTYPE_BUILD_CLIENT=OFF 2>&1 | tee build-server-only.log
          cmake --build --preset linux-release 2>&1 | tee -a build-server-only.log

      - name: Annotate build errors
        if: failure()
        shell: bash
        run: .github/scripts/annotate-build-log.sh build-server-only.log

      - name: Check the server is built and nothing client-side is
        shell: bash
        run: |
          if [ ! -x r-type_server ]; then
            echo "::error::Missing executable: r-type_server"
            exit 1
          fi
          if [ -e r-type_client ]; then
            echo "::error::r-type_client was built with RTYPE_BUILD_CLIENT=OFF"
            exit 1
          fi
          if grep -q "^raylib_SOURCE_DIR" build/linux-release/CMakeCache.txt; then
            echo "::error::Raylib was configured with RTYPE_BUILD_CLIENT=OFF"
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-server-only
          path: build-server-only.log
          if-no-files-found: warn

  # ============================================================
  # Windows compilation
  #
  # Windows uses Clang-cl.
  # ============================================================

  compilation_required_windows:
    name: Windows compilation
    if: ${{ github.repository != vars.MIRROR_URL }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 5

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Build binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "Makefile") {
            Write-Host "Detected Makefile"

            $env:CC = "clang-cl"
            $env:CXX = "clang-cl"

            make -j $env:NUMBER_OF_PROCESSORS
          }
          elseif (Test-Path "CMakeLists.txt") {
            Write-Host "Detected CMake project"

            cmake --preset windows-clangcl-release 2>&1 | Tee-Object -FilePath build.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            cmake --build --preset windows-clangcl-release --parallel 2>&1 | Tee-Object -FilePath build.log -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          else {
            Write-Error "No supported build system found"
            exit 1
          }

      - name: Annotate build errors
        if: failure()
        shell: bash
        run: .github/scripts/annotate-build-log.sh build.log

      - name: Check executables
        if: ${{ vars.EXECUTABLES != '' }}
        shell: pwsh
        env:
          EXECUTABLES: ${{ vars.EXECUTABLES }}
        run: |
          foreach ($binary in $env:EXECUTABLES -split "\s+") {
            $binary = $binary.Trim()

            if ([string]::IsNullOrWhiteSpace($binary)) {
              continue
            }

            $path = $binary
            if ([string]::IsNullOrEmpty([System.IO.Path]::GetExtension($path))) {
              $path = "$path.exe"
            }

            if (-not (Test-Path $path -PathType Leaf)) {
              Write-Host "::error::Missing executable: $binary"
              exit 1
            }
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows
          path: build.log
          if-no-files-found: warn

  # ============================================================
  # Clang-Tidy
  # ============================================================

  static_analysis:
    name: Static analysis with clang tidy
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    timeout-minutes: 10

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      CC: clang
      CXX: clang++

    steps:
      - name: Install dependencies
        run: |
          apt update
          apt install -y clang-tidy zstd $RAYLIB_PACKAGES

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List the files to analyse
        id: files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dirs='engine|network|rtype|apps|tests'

          if [ -z "$BASE_SHA" ]; then
            echo "No pull request base: analysing every file"
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA")

          if grep -qE '^(\.clang-tidy|CMakeLists\.txt|CMakePresets\.json)$|^cmake/' <<< "$changed"; then
            echo "The clang-tidy or CMake configuration changed: analysing every file"
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sources=$(grep -E "^($dirs)/.*\.cpp$" <<< "$changed" || true)
          for header in $(grep -E "^($dirs)/.*\.hpp$" <<< "$changed" || true); do
            name=$(basename "$header")
            sources+=$'\n'$(grep -rlE --include='*.cpp' "#include [\"<](.*/)?${name//./\\.}[\">]" \
              engine network rtype apps tests || true)
          done
          sources=$(sort -u <<< "$sources" | sed '/^$/d')

          if [ -z "$sources" ]; then
            echo "No C++ source changed: nothing to analyse"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Files to analyse:"
          echo "$sources"
          echo "mode=changed" >> "$GITHUB_OUTPUT"
          echo "regex=$PWD/($(sed 's/[.+]/\\&/g' <<< "$sources" | paste -sd '|'))\$" >> "$GITHUB_OUTPUT"

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Build
        if: steps.files.outputs.mode != 'none'
        shell: bash
        env:
          MODE: ${{ steps.files.outputs.mode }}
          REGEX: ${{ steps.files.outputs.regex }}
        run: |
          set -eo pipefail

          if [ -f Makefile ]; then
            echo "Detected Makefile"

            apt install -y bear
            make fclean
            bear -- make all -j

            python3 run-clang-tidy.py -j$(nproc) \
              -p . 2>&1 | tee analysis.log

          elif [ -f CMakeLists.txt ]; then
            echo "Detected CMake project"

            cmake --preset linux-debug

            if [ "$MODE" = "all" ]; then
              REGEX="$PWD/(engine|network|rtype|apps|tests)/"
            fi

            python3 run-clang-tidy.py -j$(nproc) \
              -p build/linux-debug \
              "$REGEX" 2>&1 | tee analysis.log

          else
            echo "No supported build system found"
            exit 1
          fi

      - name: Annotations for clang tidy log
        if: always()
        continue-on-error: true
        run: |
          echo "::group::Static analysis errors"

          if [ -f analysis.log ]; then
            awk '
            /(warning:|error:)/ {
              split($1, loc, ":")
              file = loc[1]
              line = loc[2]

              level = "notice"

              if ($0 ~ /warning:/)
                level="warning"
              else if ($0 ~ /error:/)
                level="error"

              msg = $0
              sub(/^[^:]*:[^:]*:[^:]*: (warning:|error:) /, "", msg)
              sub(/^\[[^]]*\]/, "", msg)

              printf "::%s file=%s,line=%s,title=%s::%s\n", \
                level, file, line, $NF, msg
            }
            ' analysis.log
          fi

          echo "::endgroup::"

          if [ -f analysis.log ] && grep -q "error:" analysis.log; then
            exit 84
          fi

  # ============================================================
  # Linux unit tests + coverage
  # ============================================================

  unit_test_linux:
    name: Run unit tests (Linux)
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    timeout-minutes: 6
    needs: compilation_required

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

    permissions:
      checks: write
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Install dependencies
        run: |
          clang --version
          apt update
          apt install -y llvm python3-full tar zstd $RAYLIB_PACKAGES

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Configure CMake
        run: |
          cmake --preset linux-coverage

      - name: Build binaries
        run: |
          cmake --build --preset linux-coverage

      - name: Run tests
        run: |
          ctest \
            --test-dir build/linux-coverage \
            --output-on-failure \
            --output-junit test-results.xml

      - name: Fix Git ownership
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Publish Test Results to GitHub Checks
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: GTest Results (Linux)
          path: '**/test-results.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: |
            build/linux-coverage/coverage_html
            build/linux-coverage/coverage.json
          if-no-files-found: warn

  # ============================================================
  # Windows unit tests
  #
  # Windows uses Clang-cl.
  # ============================================================

  unit_test_windows:
    name: Run unit tests (Windows)
    runs-on: windows-2025-vs2026
    timeout-minutes: 5
    needs: compilation_required_windows

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

    permissions:
      checks: write
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake --preset windows-clangcl-debug

      - name: Build binaries
        shell: pwsh
        run: |
          cmake --build --preset windows-clangcl-debug --parallel

      - name: Run tests
        shell: pwsh
        run: |
          ctest --preset windows-clangcl-debug --output-junit test-results.xml

      - name: Publish Test Results to GitHub Checks
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: GTest Results (Windows)
          path: '**/test-results.xml'
          reporter: java-junit
          fail-on-error: false

  # ============================================================
  # Deploy coverage
  # ============================================================

  deploy-coverage:
    name: Deploy coverage
    needs:
      - unit_test_linux
      - unit_test_windows
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: coverage-pages
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-html
          path: coverage-artifact

      - name: Fetch the published history
        run: |
          if git fetch --depth 1 origin gh-pages \
            && git show FETCH_HEAD:history.json > published-history.json; then
            echo "Published history found"
          else
            echo "[]" > published-history.json
          fi

      - name: Build the coverage site
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          append=()
          if [ "$EVENT" = "push" ] && [ "$BRANCH" = "main" ]; then
            append=(--append-history)
          fi

          python3 .github/scripts/coverage-site.py \
            --summary coverage-artifact/coverage.json \
            --report coverage-artifact/coverage_html \
            --history published-history.json \
            --template .github/coverage-site \
            --site site \
            --commit "$COMMIT" \
            --branch "$BRANCH" \
            --event "$EVENT" \
            --pull-request "$PULL_REQUEST" \
            --repository-url "$REPOSITORY_URL" \
            --run-url "$RUN_URL" \
            "${append[@]}"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site

  # ============================================================
  # Push to mirror
  # ============================================================

  push_to_mirror:
    name: Push to mirror

    needs:
      - unit_test_linux
      - unit_test_windows
      - compilation_server_only
      - static_analysis

    if: ${{ github.repository_owner == vars.USERNAME }}

    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch complete history
        run: |
          git fetch --unshallow

      - name: Mirror repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ vars.FULL_MIRROR_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}