name: Continuous Integration

env:
  JOB_FAILS: "false"

on:
  pull_request:
    branches-ignore:
      - 'temp/*'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # Linux compilation gate
  # ============================================================

  compilation_required:
    name: Compilation required
    if: ${{ github.repository != vars.MIRROR_URL }}
    runs-on: ubuntu-latest
    container: janumaruku/epitest-with-raylib
    timeout-minutes: 4

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build binary
        run: |
          set -e

          if [ -f Makefile ]; then
            echo "Detected Makefile"
            make -j$(nproc) 2>&1

          elif [ -f CMakeLists.txt ]; then
            echo "Detected CMake project"
            cmake -B build
            cmake --build build -j$(nproc) 2>&1

          else
            echo "No supported build system found"
            exit 1
          fi

      - name: Check executables
        if: ${{ vars.EXECUTABLES != '' }}
        run: |
          for binary in ${{ vars.EXECUTABLES }}; do
            if [ ! -x "$binary" ]; then
              echo "::error::Missing executable: $binary"
              exit 1
            fi
          done

  # ============================================================
  # Windows compilation
  #
  # Windows uses Clang-cl.
  # ============================================================

  compilation_required_windows:
    name: Windows compilation
    if: ${{ github.repository != vars.MIRROR_URL }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 6

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.cpm-cache
          key: cpm-${{ runner.os }}-clang-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-clang-

      - name: Configure CMake
        shell: pwsh
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}\.cpm-cache
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -T ClangCL

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

  # ============================================================
  # Clang-Tidy
  # ============================================================

  static_analysis:
    name: Static analysis with clang tidy
    runs-on: ubuntu-latest
    container: janumaruku/epitest-with-raylib
    needs: compilation_required

    steps:
      - name: Install dependencies
        run: |
          apt update
          apt install -y clang-tidy bear

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          set -e

          if [ -f Makefile ]; then
            echo "Detected Makefile"

            make fclean
            bear -- make all -j

            python3 run-clang-tidy.py -j$(nproc) \
              -p . 2>&1 | tee analysis.log

          elif [ -f CMakeLists.txt ]; then
            echo "Detected CMake project"

            cmake -B build
            cmake --build build

            python3 run-clang-tidy.py -j$(nproc) \
              -p build 2>&1 | tee analysis.log

          else
            echo "No supported build system found"
            exit 1
          fi

      - name: Annotations for clang tidy log
        if: always()
        continue-on-error: true
        run: |
          echo "::group::Static analysis errors"

          if [ -f analysis.log ]; then
            awk '
            /(warning:|error:)/ {
              split($1, loc, ":")
              file = loc[1]
              line = loc[2]

              level = "notice"

              if ($0 ~ /warning:/)
                level="warning"
              else if ($0 ~ /error:/)
                level="error"

              msg = $0
              sub(/^[^:]*:[^:]*:[^:]*: (warning:|error:) /, "", msg)
              sub(/^\[[^]]*\]/, "", msg)

              printf "::%s file=%s,line=%s,title=%s::%s\n", \
                level, file, line, $NF, msg
            }
            ' analysis.log
          fi

          echo "::endgroup::"

          if [ -f analysis.log ] && grep -q "error:" analysis.log; then
            exit 84
          fi

  # ============================================================
  # Linux unit tests + coverage
  # ============================================================

  unit_test_linux:
    name: Run unit tests (Linux)
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    needs: compilation_required

    permissions:
      checks: write
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Install dependencies
        run: |
          clang --version
          apt update
          apt install -y python3-full

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cpm-cache
          key: cpm-${{ runner.os }}-clang-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-clang-

      - name: Configure CMake
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DWITH_COVERAGE=ON

      - name: Build binaries
        run: |
          cmake --build build \
            --target coverage \
            --config Release \
            -j$(nproc)

      - name: Run tests
        working-directory: build
        run: |
          ctest -V --output-junit test-results.xml

      - name: Fix Git ownership
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Publish Test Results to GitHub Checks
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: GTest Results (Linux)
          path: '**/test-results.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage_html
          if-no-files-found: warn

  # ============================================================
  # Windows unit tests
  #
  # Windows uses Clang-cl.
  # ============================================================

  unit_test_windows:
    name: Run unit tests (Windows)
    runs-on: windows-2025-vs2026
    needs: compilation_required_windows

    permissions:
      checks: write
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.cpm-cache
          key: cpm-${{ runner.os }}-clang-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-clang-

      - name: Configure CMake
        shell: pwsh
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}\.cpm-cache
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -T ClangCL

      - name: Build binaries
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Run tests
        shell: pwsh
        working-directory: build
        run: |
          ctest -C Release -V --output-junit test-results.xml

      - name: Publish Test Results to GitHub Checks
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: GTest Results (Windows)
          path: '**/test-results.xml'
          reporter: java-junit
          fail-on-error: false

  # ============================================================
  # Deploy coverage
  # ============================================================

  deploy-coverage:
    name: Deploy coverage
    needs:
      - unit_test_linux
      - unit_test_windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-html
          path: .

      - name: Debug coverage structure
        run: |
          tree

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .

  # ============================================================
  # Push to mirror
  # ============================================================

  push_to_mirror:
    name: Push to mirror

    needs:
      - static_analysis
      - unit_test_linux
      - unit_test_windows

    if: ${{ github.repository_owner == vars.USERNAME }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch complete history
        run: |
          git fetch --unshallow

      - name: Mirror repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ vars.FULL_MIRROR_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}